<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solace is a simple, supportive space to talk, reflect, and put your thoughts into words." />
    <title>Solace</title>
    <script>
      // Apply the saved theme before the page paints (avoids a flash of the wrong theme)
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
